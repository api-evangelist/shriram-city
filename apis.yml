description: 'Shriram City (Shriram City Union Finance Ltd) was a leading Indian non-banking
  financial company (NBFC) in the Shriram Group, offering personal, business, two-wheeler,
  gold and small-enterprise loans plus fixed deposits. Founded 1986 in Chennai, it was
  surfaced as a portfolio company of bessemer-venture-partners. In November 2022 the
  company was amalgamated into Shriram Finance Ltd; its www.shriramcity.in host no longer
  resolves and the shriramcity.in apex now redirects to shriramfinance.in. No public
  developer or API program was found. This profile was enriched by the API Evangelist
  pipeline: web search + live domain/security/well-known probes.'
